name: market-news

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: news_seen.json
          key: news-state-${{ github.run_id }}
          restore-keys: news-state-

      - name: Run agent
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
        run: |
          [ -f news_config.json ] || echo '{}' > news_config.json
          python news_agent.py --once

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: news_seen.json
          key: news-state-${{ github.run_id }}
